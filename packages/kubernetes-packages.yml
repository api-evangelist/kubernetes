generated: '2026-06-20'
method: searched
source: https://kubernetes.io/docs/reference/using-api/client-libraries/
description: >-
  Officially-supported Kubernetes client libraries, maintained by Kubernetes
  SIG API Machinery under the kubernetes-client GitHub organization (plus the
  in-tree Go client, client-go). Community-maintained libraries exist for many
  additional languages; only the officially-supported set is captured here.
packages:
  - language: go
    registry: pkg.go.dev
    name: k8s.io/client-go
    url: https://pkg.go.dev/k8s.io/client-go
    repository: https://github.com/kubernetes/client-go
    install: go get k8s.io/client-go@latest
    official: true
  - language: python
    registry: pypi
    name: kubernetes
    url: https://pypi.org/project/kubernetes/
    repository: https://github.com/kubernetes-client/python
    install: pip install kubernetes
    official: true
  - language: javascript
    registry: npm
    name: "@kubernetes/client-node"
    url: https://www.npmjs.com/package/@kubernetes/client-node
    repository: https://github.com/kubernetes-client/javascript
    install: npm install @kubernetes/client-node
    official: true
  - language: java
    registry: maven
    name: io.kubernetes:client-java
    url: https://mvnrepository.com/artifact/io.kubernetes/client-java
    repository: https://github.com/kubernetes-client/java
    install: "implementation 'io.kubernetes:client-java'"
    official: true
  - language: dotnet
    registry: nuget
    name: KubernetesClient
    url: https://www.nuget.org/packages/KubernetesClient/
    repository: https://github.com/kubernetes-client/csharp
    install: dotnet add package KubernetesClient
    official: true
  - language: ruby
    registry: rubygems
    name: kubernetes-client
    url: https://rubygems.org/gems/kubernetes-client
    repository: https://github.com/kubernetes-client/ruby
    install: gem install kubernetes-client
    official: true
  - language: haskell
    registry: hackage
    name: kubernetes-client
    url: https://hackage.haskell.org/package/kubernetes-client
    repository: https://github.com/kubernetes-client/haskell
    official: true
  - language: perl
    registry: cpan
    name: Kubernetes::REST
    url: https://metacpan.org/
    repository: https://github.com/kubernetes-client/perl
    official: true
  - language: c
    registry: source
    name: kubernetes-client-c
    url: https://github.com/kubernetes-client/c
    repository: https://github.com/kubernetes-client/c
    official: true
