  notes: >-
    API objects are grouped (e.g. apps/v1, autoscaling/v2, rbac.authorization.k8s.io/v1)
    and each group/version carries its own stability guarantees. alpha may change or
    be removed without notice; beta is enabled by default and follows the deprecation
    policy; stable will not be removed.
deprecation:
