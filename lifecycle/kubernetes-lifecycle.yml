    A deprecated GA/beta API version must be supported for a minimum number of
    releases after deprecation (GA: 12 months or 3 releases, whichever is longer;
    beta: 9 months or 3 releases). Deprecated REST responses set the Warning
    header (299) via the standard warning mechanism.
