      path: /api/v1/namespaces/{namespace}/configmaps
      operations:
      - name: listnamespacedconfigmaps
        method: GET
        description: Kubernetes List ConfigMaps in a namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnamespacedconfigmap
