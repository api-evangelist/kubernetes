naftiko: 1.0.0-alpha2
info:
  label: Kubernetes API
  description: 'Kubernetes API. 5 operations. Lead operation: Kubernetes List services in a namespace. Self-contained Naftiko
    capability covering one Kubernetes business surface.'
  tags:
  - Kubernetes
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KUBERNETES_API_KEY: KUBERNETES_API_KEY
capability:
  consumes:
  - type: http
    namespace: kubernetes-general
    baseUri: https://kubernetes.default.svc
    description: Kubernetes API business capability. Self-contained, no shared references.
    resources:
    - name: api-v1-namespaces-namespace-services
      path: /api/v1/namespaces/{namespace}/services
      operations:
      - name: listnamespacedservices
        method: GET
        description: Kubernetes List services in a namespace
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createnamespacedservice
        method: POST
        description: Kubernetes Create a service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: api-v1-namespaces-namespace-services-name
      path: /api/v1/namespaces/{namespace}/services/{name}
      operations:
      - name: getnamespacedservice
        method: GET
        description: Kubernetes Get a service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: replacenamespacedservice
        method: PUT
        description: Kubernetes Replace a service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletenamespacedservice
        method: DELETE
        description: Kubernetes Delete a service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.KUBERNETES_API_KEY}}'
  exposes:
  - type: rest
    namespace: kubernetes-general-rest
    port: 8080
    description: REST adapter for Kubernetes API. One Spectral-compliant resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/api/v1/namespaces/{namespace}/services
      name: api-v1-namespaces-namespace-services
      description: REST surface for api-v1-namespaces-namespace-services.
      operations:
      - method: GET
        name: listnamespacedservices
        description: Kubernetes List services in a namespace
        call: kubernetes-general.listnamespacedservices
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnamespacedservice
        description: Kubernetes Create a service
        call: kubernetes-general.createnamespacedservice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/v1/namespaces/{namespace}/services/{name}
      name: api-v1-namespaces-namespace-services-name
      description: REST surface for api-v1-namespaces-namespace-services-name.
      operations:
      - method: GET
        name: getnamespacedservice
        description: Kubernetes Get a service
        call: kubernetes-general.getnamespacedservice
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: replacenamespacedservice
        description: Kubernetes Replace a service
        call: kubernetes-general.replacenamespacedservice
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletenamespacedservice
        description: Kubernetes Delete a service
        call: kubernetes-general.deletenamespacedservice
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kubernetes-general-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kubernetes API. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: kubernetes-list-services-namespace
      description: Kubernetes List services in a namespace
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kubernetes-general.listnamespacedservices
      outputParameters:
      - type: object
        mapping: $.
    - name: kubernetes-create-service
      description: Kubernetes Create a service
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kubernetes-general.createnamespacedservice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: kubernetes-get-service
      description: Kubernetes Get a service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kubernetes-general.getnamespacedservice
      outputParameters:
      - type: object
        mapping: $.
    - name: kubernetes-replace-service
      description: Kubernetes Replace a service
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: kubernetes-general.replacenamespacedservice
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: kubernetes-delete-service
      description: Kubernetes Delete a service
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: kubernetes-general.deletenamespacedservice
      outputParameters:
      - type: object
        mapping: $.
