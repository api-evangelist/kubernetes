naftiko: 1.0.0-alpha2
info:
  label: Kubernetes API — RBAC
  description: 'Kubernetes API — RBAC. 2 operations. Lead operation: Kubernetes List ClusterRoles. Self-contained Naftiko
    capability covering one Kubernetes business surface.'
  tags:
  - Kubernetes
  - RBAC
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    KUBERNETES_API_KEY: KUBERNETES_API_KEY
capability:
  consumes:
  - type: http
    namespace: kubernetes-rbac
    baseUri: https://kubernetes.default.svc
    description: Kubernetes API — RBAC business capability. Self-contained, no shared references.
    resources:
    - name: apis-rbac.authorization.k8s.io-v1-clusterroles
      path: /apis/rbac.authorization.k8s.io/v1/clusterroles
      operations:
      - name: listclusterroles
        method: GET
        description: Kubernetes List ClusterRoles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createclusterrole
        method: POST
        description: Kubernetes Create a ClusterRole
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.KUBERNETES_API_KEY}}'
  exposes:
  - type: rest
    namespace: kubernetes-rbac-rest
    port: 8080
    description: REST adapter for Kubernetes API — RBAC. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apis/rbac-authorization-k8s-io/v1/clusterroles
      name: apis-rbac-authorization-k8s-io-v1-clusterroles
      description: REST surface for apis-rbac.authorization.k8s.io-v1-clusterroles.
      operations:
      - method: GET
        name: listclusterroles
        description: Kubernetes List ClusterRoles
        call: kubernetes-rbac.listclusterroles
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createclusterrole
        description: Kubernetes Create a ClusterRole
        call: kubernetes-rbac.createclusterrole
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: kubernetes-rbac-mcp
    port: 9090
    transport: http
    description: MCP adapter for Kubernetes API — RBAC. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: kubernetes-list-clusterroles
      description: Kubernetes List ClusterRoles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: kubernetes-rbac.listclusterroles
      outputParameters:
      - type: object
        mapping: $.
    - name: kubernetes-create-clusterrole
      description: Kubernetes Create a ClusterRole
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: kubernetes-rbac.createclusterrole
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
