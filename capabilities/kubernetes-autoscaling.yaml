        name: listnamespacedhorizontalpodautoscalers
        description: Kubernetes List HorizontalPodAutoscalers in a namespace
        call: kubernetes-autoscaling.listnamespacedhorizontalpodautoscalers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createnamespacedhorizontalpodautoscaler
        description: Kubernetes Create a HorizontalPodAutoscaler
        call: kubernetes-autoscaling.createnamespacedhorizontalpodautoscaler
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
